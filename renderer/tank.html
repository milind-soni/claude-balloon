<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="style.css" />
  <title>Claude Balloon — tank</title>
</head>
<body class="tankwin">
  <div id="stage"></div>

  <div id="dock" class="ia" title="Hold the nozzle, speak a task, release">
    <div id="knots" title="popped balloons — click one to see its result"></div>
    <div id="mic">
      <div id="nozzle"><div id="nozzleTip"></div></div>
      <div id="valve"></div>
      <div id="tank">
        <div id="gauge"><div id="gNeedle"></div></div>
        <div class="tankLabel">HELIUM<br /><b>CLAUDE&nbsp;GRADE</b></div>
        <div id="dirLabel" title="Click to change the folder tasks work in">~</div>
        <div id="hint">hold · speak</div>
      </div>
    </div>
  </div>

  <script src="tank.js"></script>
</body>
</html>
