<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="style.css" />
  <title>Claude Balloon — tank</title>
</head>
<body class="tankwin">
  <div id="stage"></div>

  <!-- console + result cards stack above the tank -->
  <div id="panels"></div>

  <div id="dock" class="ia">
    <!-- slides out to the right on hover: active balloons + popped knots -->
    <div id="sidePanel">
      <div id="fleet"></div>
      <div id="knots" title="popped balloons — click to re-read the result"></div>
    </div>
    <div id="mic">
      <div id="nozzle" title="Hold, speak a task, release"><div id="nozzleTip"></div></div>
      <div id="valve"></div>
      <div id="tank" title="Drag me anywhere">
        <div id="quit" title="Quit Claude Balloon">✕</div>
        <div id="gauge"><div id="gNeedle"></div></div>
        <img id="clogo" src="claude.svg" alt="Claude" />
        <div class="tankLabel">HELIUM<br /><b>CLAUDE&nbsp;GRADE</b></div>
        <div id="dirLabel" title="Click to change the folder tasks work in">~</div>
        <div id="hint">hold nozzle · speak</div>
      </div>
    </div>
  </div>

  <script src="tank.js"></script>
</body>
</html>
